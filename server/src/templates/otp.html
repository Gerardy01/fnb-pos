<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Email OTP</title>
    </head>
    <body style="font-family: Arial, sans-serif; max-width: 500px; margin: auto; padding: 20px; border: 1px solid #eee; border-radius: 15px;">
        <h2 style="color: #4285f4; text-align: center;">Email OTP</h2>
        <hr />
        <p>Dear User,</p>
        <p>Your One-Time Password (OTP) is:</p>
        <h1 style="color: #4285f4; text-align: center;"><%= otp %></h1>
        <p>
            Please use this OTP to complete your login process. Do not share this
            code with anyone.
        </p>
        <p>Thank you for using Email OTP!</p>
        <p style="font-size: 12px; text-align: center; color: #888;">
        &copy;
        <a href="https://www.google.com" style="color: #888;"
            >my web link later</a
        >. All rights reserved.
        </p>
    </body>
</html>
